<!DOCTYPE html>
<html>
<head>
    <title>Parkinson Detector</title>
    <style>
        body { font-family: Arial; text-align: center; }
        .tab { display: none; }
        button { padding: 10px; margin: 5px; }
    </style>
</head>
<body>

<h1>🧠 Parkinson Detector</h1>

<button onclick="showTab('voice')">🎤 Voice</button>
<button onclick="showTab('handwriting')">✍️ Handwriting</button>

<!-- Voice Tab -->
<div id="voice" class="tab">
    <h2>Voice Detection</h2>
    <button onclick="startRecording()">Start Recording</button>
    <button onclick="stopRecording()">Stop</button>
    <p id="voiceResult"></p>
</div>

<!-- Handwriting Tab -->
<div id="handwriting" class="tab">
    <h2>Handwriting Detection</h2>
    <input type="file" id="imageInput">
    <button onclick="uploadImage()">Predict</button>
    <p id="imageResult"></p>
</div>

<script>
let mediaRecorder;
let audioChunks = [];

function showTab(tab) {
    document.getElementById("voice").style.display = "none";
    document.getElementById("handwriting").style.display = "none";
    document.getElementById(tab).style.display = "block";
}

// 🎤 Voice recording
async function startRecording() {
    let stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    mediaRecorder = new MediaRecorder(stream);

    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);

    mediaRecorder.start();
}

function stopRecording() {
    mediaRecorder.stop();

    mediaRecorder.onstop = async () => {
        let blob = new Blob(audioChunks, { type: 'audio/wav' });

        let formData = new FormData();
        formData.append("file", blob);

        let response = await fetch("https://parkinsons-detector-lu0v.onrender.com/predict_voice", {
            method: "POST",
            body: formData
        });

        let data = await response.json();
        document.getElementById("voiceResult").innerText = data.prediction;
    };
}

// ✍️ Image upload
async function uploadImage() {
    let fileInput = document.getElementById("imageInput");
    let formData = new FormData();
    formData.append("file", fileInput.files[0]);

    let response = await fetch("https://parkinsons-detector-lu0v.onrender.com/predict_image", {
        method: "POST",
        body: formData
    });

    let data = await response.json();
    document.getElementById("imageResult").innerText = data.prediction;
}
</script>

</body>
</html>
